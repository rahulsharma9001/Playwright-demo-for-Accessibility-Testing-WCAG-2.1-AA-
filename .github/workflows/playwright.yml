name: Playwright Accessibility Tests

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  functional-tests:
    name: Functional Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright functional tests
        run: npx playwright test tests/functional --reporter=html || true

      - name: Upload functional playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-functional
          path: playwright-report
          retention-days: 30

      - name: Upload functional test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-functional
          path: test-results
          retention-days: 30

  accessibility-tests:
    name: Accessibility Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright accessibility tests (axe/pa11y)
        run: npx playwright test tests/accessibility --reporter=html || true

      - name: Upload accessibility playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-accessibility
          path: playwright-report
          retention-days: 30

      - name: Upload accessibility test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-accessibility
          path: test-results
          retention-days: 30

      - name: Upload accessibility HTML reports directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-accessibility
          path: reports/html
          retention-days: 30
